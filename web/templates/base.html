<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Night Shift ML{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom border-danger-subtle sticky-top">
    <div class="container">
      <a class="navbar-brand brand" href="{{ url_for('index') }}">
        <span class="brand-eye" aria-hidden="true"></span> Night Shift ML
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
              aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
          {% set endpoint = request.endpoint %}
          <li class="nav-item">
            <a class="nav-link {{ 'active' if endpoint == 'index' }}" href="{{ url_for('index') }}">Play</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {{ 'active' if endpoint == 'how_it_works' }}" href="{{ url_for('how_it_works') }}">How it works</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {{ 'active' if endpoint == 'results' }}" href="{{ url_for('results') }}">Results</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-top border-secondary-subtle py-3 mt-5">
    <div class="container text-center small text-body-secondary">
      Jesus Nuncira &middot; Miguel Moreno &middot; Machine Learning, Universidad de Cundinamarca
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
