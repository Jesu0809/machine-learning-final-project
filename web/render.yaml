services:
  - type: web
    name: night-shift
    runtime: python
    rootDir: web
    plan: free
    buildCommand: "cd ml-frontend && npm install && npm run build && cd .. && pip install -r requirements.txt"
    startCommand: "gunicorn app:app --timeout 300"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 24.20.0
