services:
  - type: web
    name: night-shift
    runtime: python
    rootDir: web
    plan: free
    buildCommand: "cd ml-frontend && npm install && npm run build && cd .. && pip install -r requirements.txt"
    startCommand: "gunicorn app:app --timeout 300"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 24.20.0
      # Postgres for the players' saves (the free disk is erased on every deploy).
      - key: DATABASE_URL
        sync: false
      # Lets tools/summarize_playlog.py download the anonymous saves.
      - key: SAVES_EXPORT_TOKEN
        generateValue: true
