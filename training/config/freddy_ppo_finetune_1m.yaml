# Fine-tuning run: the same PPO setup as freddy_ppo.yaml, started from an earlier run's weights
# (mlagents-learn --initialize-from=<run>) for 1M more steps (stopped early: past 1M freddy_v13 traded searching for patrol bonus). Every change is in docs/training-log.md.
# The behavior name must match FreddyBrain.BehaviorName ("Freddy").
behaviors:
  Freddy:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 1000000
    time_horizon: 128
    summary_freq: 20000
    checkpoint_interval: 250000
    keep_checkpoints: 10
